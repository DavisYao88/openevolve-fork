<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenEvolve 进化可视化</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div id="toolbar">
        <div style="display:flex;flex-direction:column;min-width:220px;">
            <span style="font-size:1.1em;font-weight:bold;">OpenEvolve 进化可视化</span>
            <span id="checkpoint-label" style="font-size:0.9em;color:#888;">检查点：无</span>
        </div>
        <div class="toolbar-spacer"></div>
        <nav class="page-nav" aria-label="OpenEvolve 页面导航">
            <a href="/" aria-current="page">进化可视化</a>
            <a href="/manual">人工反馈</a>
            <a href="/launch">新建进化</a>
        </nav>
        <div class="tabs">
            <div class="tab active" id="tab-branching">进化树</div>
            <div class="tab" id="tab-performance">性能趋势</div>
            <div class="tab" id="tab-list">程序列表</div>
        </div>
        <label class="toolbar-label" for="metric-select">指标：
        <select id="metric-select">
            <option value="combined_score" selected>combined_score</option>
        </select></label>
        <label class="toolbar-label" for="highlight-select">高亮：
        <select id="highlight-select">
            <option value="none">无</option>
            <option value="top" selected>最高分</option>
            <option value="first">初始代</option>
            <option value="failed">评测失败</option>
            <option value="unset">指标未设置</option>
        </select></label>
        <div class="toolbar-darkmode">
            <label class="toolbar-label">深色模式：</label>
            <input type="checkbox" id="darkmode-toggle">
            <span id="darkmode-label">🌙</span>
        </div>
    </div>
    <div id="sidebar">
        <div id="sidebar-content">
            <span style="color:#888;">
                选择一个程序节点以查看详情。
            </span>
        </div>
    </div>
    <div id="view-branching" class="active" style="padding-top:3.5em;">
        <div id="graph"></div>
    </div>
    <div id="view-list" style="display:none;padding-top:3.5em;">
        <div style="display:flex;align-items:center;gap:1em;margin-bottom:1em;">
            <input id="list-search" type="text" placeholder="搜索程序 ID…" aria-label="搜索程序 ID" style="font-size:1em;padding:0.4em 1em;border-radius:6px;border:1px solid #ccc;min-width:220px;">
            <select id="list-sort" style="font-size:1em;padding:0.3em 1em;border-radius:6px;border:1px solid #ccc;">
                <option value="id">按 ID 排序</option>
                <option value="generation" selected>按代数排序</option>
                <option value="island">按岛屿排序</option>
                <option value="score">按指标排序</option>
            </select>
        </div>
        <div id="node-list-container"></div>
    </div>
    <div id="view-performance" style="padding-top:4.5em;"></div>
    <div id="view-prompts" style="padding-top:3.5em;"></div>
    <script type="module" src="{{ url_for('static', filename='js/state.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/mainUI.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/graph.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/performance.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/list.js') }}"></script>
</body>
</html>
