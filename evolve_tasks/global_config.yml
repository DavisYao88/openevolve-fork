# Shared runtime configuration for visualizer-launched evolution tasks.
max_iterations: 50
checkpoint_interval: 5
log_level: INFO
random_seed: 42
language: python

# Local models such as qwen3.6:35b copy SEARCH blocks imprecisely (full-width
# punctuation, aligned spaces), so ask for whole-file rewrites instead. The
# evolve-block enforcement below still keeps everything outside PARAMS intact.
diff_based_evolution: false
enforce_evolve_blocks: true
max_code_length: 20000

llm:
  api_base: "https://api.deepseek.com"       # OpenAI 兼容端点；platform.deepseek.com 是控制台域名，会被网关拦 429
  api_key: "***REDACTED-API-KEY***"                        # 占位值，避免依赖 shell 里的 OPENAI_API_KEY
  primary_model: "deepseek-flash"            # 平台实际 id：deepseek-flash / deepseek-v4-pro
  temperature: 0.6
  max_tokens: 16000                        # thinking 模型，给足预算
  timeout: 1800                            # 单次请求 30 分钟，本地 35B 必须放宽
  retries: 1
  retry_delay: 10
    
database:
  population_size: 30
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 3600
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  enable_artifacts: true
  evaluator_args:
    # runner_command 由页面按本轮 input/runner_adapter.py 生成；
    # objective（怎么算分）与 validation（候选允许怎么改）来自选中的任务模板
    # solver/templates/<模板>/template.yml，也可在页面的高级配置里覆盖；
    # reference_program_path 指向本轮初始程序，供结构校验比对。
    runner_cwd: null
    timeout_seconds: 3500
