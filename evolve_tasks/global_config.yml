# Shared runtime configuration for visualizer-launched evolution tasks.
max_iterations: 50
checkpoint_interval: 5
log_level: INFO
random_seed: 42
language: python

diff_based_evolution: true
enforce_evolve_blocks: true
max_code_length: 20000

llm:
  api_base: "http://localhost:11434/v1"   # Ollama 的 OpenAI 兼容端点
  api_key: "ollama"                        # 占位值，避免依赖 shell 里的 OPENAI_API_KEY
  primary_model: "qwen3.6:35b"
  temperature: 0.6
  max_tokens: 16000                        # thinking 模型，给足预算
  timeout: 1800                            # 单次请求 30 分钟，本地 35B 必须放宽
  retries: 1
  retry_delay: 10
    
database:
  population_size: 30
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 3600
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  enable_artifacts: true
  evaluator_args:
    # runner_command is generated per run from input/runner_adapter.py.
    runner_cwd: null
    timeout_seconds: 3500
