name: D+2 出库货量联合演化（参数 + 代码）
description: 同时演化 LightGBM 参数、特征增强与预测后处理；回测口径与生产完全一致，Test 封存。
defaults:
  iterations: 30

files:
  initial_program: init.py
  prompt: prompt.md
  adapter: runner_adapter.py

objective:
  metrics:
    - name: wmape
      direction: minimize
      transform: log
      scale: 100
    - name: wmape_std
      direction: minimize
      scale: 35
    - name: worst_fold_wmape
      direction: minimize
      scale: 40
    - name: bias_abs
      direction: minimize
      threshold: 0.05
      scale: 100
    - name: baseline_regret
      direction: minimize
      scale: 150

# 允许候选自由改写代码（参数越界由 adapter 夹取），所以这里不做结构校验。
validation:
  mode: none
